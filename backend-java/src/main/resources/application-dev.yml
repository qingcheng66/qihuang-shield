# 开发环境配置 (支持本地轻量文件级持久化存储，模拟 PostgreSQL 语法)
spring:
  datasource:
    # 使用本地文件持久化模式，重启不丢数据，同时兼容 PostgreSQL 语法
    url: jdbc:h2:file:./data/qihuang_shield_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
